root = "."
tmp_dir = "/tmp/air"

[build]
  cmd = "go build -o /tmp/air/monitoring-service ./cmd/monitoring_service"
  entrypoint = ["/tmp/air/monitoring-service"]
  include_ext = ["go", "env"]
  exclude_dir = [".git", "tmp", "vendor"]
  exclude_regex = ["_test.go"]
  poll = true
  poll_interval = 500
  delay = 300
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
