name: monitoring-service
services:
  migration:
    image: ${MONITORING_IMAGE:?required}
    profiles:
      - migration
    env_file:
      - .env
    command:
      - /usr/local/bin/migration
  browserless:
    image: ghcr.io/wasss4bi/values-from-body-fetcher-browserless:v0.6.0@sha256:6a068fb02e457d5856b077df0861346f11bc1927aebe1c49bdf56346d5f7e646
    restart: unless-stopped
    init: true
    shm_size: 512m
    stop_grace_period: 15s
    environment:
      TOKEN: ${BROWSERLESS_TOKEN:?required}
      MAX_CONCURRENT_SESSIONS: "2"
      QUEUE_LENGTH: "0"
      CONNECTION_TIMEOUT: "-1"
      PREBOOT_CHROME: "false"
      ENABLE_XVFB: "true"
      DEFAULT_HEADLESS: "false"
      DEFAULT_STEALTH: "true"
      DEFAULT_LAUNCH_ARGS: '["--proxy-server=http://squid:3128","--proxy-bypass-list=<-loopback>","--disable-quic","--disable-features=ServiceWorker","--disable-application-cache"]'
      DEBUG: -browserless*
      TZ: ${BROWSER_TIMEZONE:-UTC}
    volumes:
      - fetcher_profiles:/var/lib/monitoring_service/browserless-profiles
    networks:
      - fetcher_engines
      - browser_egress
    mem_limit: 2g
    pids_limit: 512
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require("http").get("http://127.0.0.1:3000/pressure?token="+process.env.TOKEN,r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on("error",()=>process.exit(1))
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10
    depends_on:
      squid:
        condition: service_started
  monitoring_service:
    image: ${MONITORING_IMAGE:?required}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      METRICS_PORT: "9100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${APP_PORT:-8080}/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6
    ports:
      - 127.0.0.1:${APP_PORT:-8080}:${APP_PORT:-8080}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "9100"
    networks:
      - default
      - redis_private
  outbox_publisher:
    image: ${MONITORING_IMAGE:?required}
    restart: unless-stopped
    env_file:
      - .env
    command:
      - /usr/local/bin/outbox-publisher
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:?required}
      METRICS_PORT: "9101"
    expose:
      - "9101"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  monitor_scheduler:
    image: ${MONITORING_IMAGE:?required}
    restart: unless-stopped
    env_file:
      - .env
    command:
      - /usr/local/bin/monitor-scheduler
    environment:
      METRICS_PORT: "9102"
    expose:
      - "9102"
    depends_on:
      postgres:
        condition: service_healthy
  endpoint_fetch_worker:
    image: ${MONITORING_IMAGE:?required}
    restart: unless-stopped
    env_file:
      - .env
    command:
      - /usr/local/bin/endpoint-fetch-worker
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:?required}
      METRICS_PORT: "9103"
      FETCHER_ADDRESS: fetcher:8443
      FETCHER_SERVER_NAME: fetcher
      FETCHER_CA_FILE: /run/fetcher-certs/ca.pem
      FETCHER_CLIENT_CERT_FILE: /run/fetcher-certs/monitoring.pem
      FETCHER_CLIENT_KEY_FILE: /run/fetcher-certs/monitoring.key
    expose:
      - "9103"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes: &a1
      - ${FETCHER_CERT_DIR:-./tmp/fetcher-certs}/ca.pem:/run/fetcher-certs/ca.pem:ro
      - ${FETCHER_CERT_DIR:-./tmp/fetcher-certs}/monitoring.pem:/run/fetcher-certs/monitoring.pem:ro
      - ${FETCHER_CERT_DIR:-./tmp/fetcher-certs}/monitoring.key:/run/fetcher-certs/monitoring.key:ro
    networks:
      - redis_private
      - default
  endpoint_fetch_html_worker:
    image: ${MONITORING_IMAGE:?required}
    restart: unless-stopped
    env_file:
      - .env
    command:
      - /usr/local/bin/endpoint-fetch-html-worker
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:?required}
      METRICS_PORT: "9105"
      FETCHER_ADDRESS: fetcher:8443
      FETCHER_SERVER_NAME: fetcher
      FETCHER_CA_FILE: /run/fetcher-certs/ca.pem
      FETCHER_CLIENT_CERT_FILE: /run/fetcher-certs/monitoring.pem
      FETCHER_CLIENT_KEY_FILE: /run/fetcher-certs/monitoring.key
    expose:
      - "9105"
    networks:
      - redis_private
      - default
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes: *a1
  parser:
    image: ghcr.io/wasss4bi/values-from-body-fetcher-parser:v0.6.0@sha256:c56604780e059cd978dd4bd35b465b544661164105f17847425c56350813bfe0
    restart: unless-stopped
    init: true
    stop_grace_period: 2m
    shm_size: 512m
    environment:
      CHROME_PATH: /usr/bin/google-chrome-stable
      BROWSERLESS_URL: ws://browserless:3000?token=${BROWSERLESS_TOKEN:?required}
      PARSER_PROXY_URL: http://squid:3128
      PARSER_PROFILE_DIR: /var/lib/monitoring_service/browserless-profiles
      PARSER_BROWSER_LANGUAGES: ${BROWSER_LANGUAGES:-ru-RU,ru}
      PARSER_PORT: "8080"
      PARSER_MAX_BROWSER_CONTEXTS: "1"
      PARSER_BOOTSTRAP_TIMEOUT_MS: "99000"
      PARSER_UPSTREAM_TIMEOUT_MS: "4500"
      PARSER_MAX_REQUEST_BYTES: "2097152"
      PARSER_MAX_RESPONSE_BYTES: "5242880"
      TZ: ${BROWSER_TIMEZONE:-UTC}
    volumes:
      - fetcher_profiles:/var/lib/monitoring_service/browserless-profiles
    networks:
      - fetcher_engines
      - browser_egress
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8080/healthz
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10
    depends_on:
      browserless:
        condition: service_healthy
      squid:
        condition: service_started
  playwright:
    image: ghcr.io/wasss4bi/values-from-body-fetcher-html:v0.6.0@sha256:97cd3039f4fc8775625d2954cf968f5ae4ad4abbc84cd53ee298d5d7b0816a37
    restart: unless-stopped
    user: 1000:1000
    init: true
    stop_grace_period: 45s
    shm_size: 512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      BROWSERLESS_URL: ws://browserless:3000?token=${BROWSERLESS_TOKEN:?required}
      PLAYWRIGHT_PROXY_URL: http://squid:3128
      PLAYWRIGHT_USER_DATA_DIR: /var/lib/monitoring_service/browserless-profiles/html
      PLAYWRIGHT_PAGE_TIMEOUT_MS: "99000"
      PLAYWRIGHT_MAX_CONCURRENT_PAGES: "1"
      PLAYWRIGHT_MAX_HTML_BYTES: "5242880"
      TZ: ${BROWSER_TIMEZONE:-UTC}
    volumes:
      - fetcher_profiles:/var/lib/monitoring_service/browserless-profiles
    networks:
      - fetcher_engines
      - browser_egress
    mem_limit: 1g
    pids_limit: 256
    depends_on:
      browserless:
        condition: service_healthy
      squid:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch("http://127.0.0.1:3000/healthz",{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 10
  squid:
    image: ghcr.io/wasss4bi/values-from-body-fetcher-squid:v0.6.0@sha256:30ed2f6915e5cc4161c16fbbc837429d568cda1dd7127e64c725ea1175b27c5b
    restart: unless-stopped
    networks:
      - browser_egress
      - fetcher_outbound
  endpoint_fetch_queue_migrator:
    image: ${MONITORING_IMAGE:?required}
    restart: unless-stopped
    profiles:
      - migration
    env_file:
      - .env
    command:
      - /usr/local/bin/endpoint-fetch-queue-migrator
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:?required}
    depends_on:
      rabbitmq:
        condition: service_healthy
  notification_worker:
    stop_grace_period: 35s
    image: ${MONITORING_IMAGE:?required}
    restart: unless-stopped
    env_file:
      - .env
    command:
      - /usr/local/bin/notification-worker
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:?required}
      METRICS_PORT: "9104"
    expose:
      - "9104"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - default
      - redis_private
  monitoring_cleanup:
    image: ${MONITORING_IMAGE:?required}
    restart: unless-stopped
    env_file:
      - .env
    command:
      - /usr/local/bin/monitoring-cleanup
    depends_on:
      postgres:
        condition: service_healthy
  rabbitmq:
    image: rabbitmq:4.2.7-management@sha256:9b931a1854b6679b67119cfbd673c02155646d93ec5618601fc258c875289684
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-monitoring_service}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?required}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    expose:
      - "15692"
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 5s
      timeout: 5s
      retries: 10
  postgres:
    image: postgres:16.14-alpine3.22@sha256:786dab398303b8ce7cb76b407bb21ef2e4dfbbbd4c6abcf3d29b3130467ffdbc
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monitoring_service}
      POSTGRES_USER: ${POSTGRES_USER:-monitoring_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-monitoring_service} -d ${POSTGRES_DB:-monitoring_service}
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:8.4.3-alpine@sha256:52e68c6542d1b658a207ba63e7545963ec7cde6c7efc8948108edfa7e339ff73
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - redis_private
  redis-exporter:
    image: oliver006/redis_exporter:v1.80.2@sha256:33fd1d09c3ba5d2354bdedfad62b06ecc54f50680823b1cf801dac9e1fd9d387
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis:6379
    expose:
      - "9121"
    depends_on:
      - redis
    networks:
      - default
      - redis_private
  prometheus:
    image: prom/prometheus:v3.12.0@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
  grafana:
    image: grafana/grafana:13.0.1@sha256:0f86bada30d65ef9d0183b90c1e2682ac92d53d95da8bed322b984ea78a4a73a
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?required}
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3010}:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
  loki:
    image: grafana/loki:3.7.2@sha256:191d4fdfb7264f16989f0a57f320872620a5a7c2ceeec6229212c4190ec49b86
    restart: unless-stopped
    volumes:
      - ./docker/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command:
      - -config.file=/etc/loki/local-config.yaml
  alloy:
    image: grafana/alloy:v1.16.2@sha256:32913cbfac652d15fa84d256a74e5ee3f71575961bb19d34796ce3838bfba693
    restart: unless-stopped
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - /etc/alloy/config.alloy
    depends_on:
      - loki
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1@sha256:e96064f876226d94bb6ce48a4c4b3dd76edba91168ec1ab024e5c4b959310b0f
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
  fetcher:
    image: ghcr.io/wasss4bi/values-from-body-fetcher:v0.6.0@sha256:e6881f2aece5d8bf461fd878a80d7494c35e3320fd74e73c1a848bb2dfc43261
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    environment:
      FETCHER_REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FETCHER_LISTEN_ADDRESS: :8443
      FETCHER_CA_FILE: /run/certs/ca.pem
      FETCHER_SERVER_CERT_FILE: /run/certs/fetcher.pem
      FETCHER_SERVER_KEY_FILE: /run/certs/fetcher.key
      FETCHER_MONITORING_NAME: ${FETCHER_CLIENT_IDENTITY:-monitoring}
      FETCHER_PARSER_URL: http://parser:8080
      FETCHER_HTML_URL: http://playwright:3000
      METRICS_PORT: "9106"
    volumes:
      - ${FETCHER_CERT_DIR:-./tmp/fetcher-certs}/ca.pem:/run/certs/ca.pem:ro
      - ${FETCHER_CERT_DIR:-./tmp/fetcher-certs}/fetcher.pem:/run/certs/fetcher.pem:ro
      - ${FETCHER_CERT_DIR:-./tmp/fetcher-certs}/fetcher.key:/run/certs/fetcher.key:ro
    networks:
      - redis_private
      - default
      - fetcher_engines
    expose:
      - "8443"
      - "9106"
  dependency_health_worker:
    image: ${MONITORING_IMAGE:?required}
    restart: unless-stopped
    env_file:
      - .env
    command:
      - /usr/local/bin/dependency-health-worker
    environment:
      FETCHER_ADDRESS: fetcher:8443
      FETCHER_SERVER_NAME: fetcher
      FETCHER_CA_FILE: /run/fetcher-certs/ca.pem
      FETCHER_CLIENT_CERT_FILE: /run/fetcher-certs/monitoring.pem
      FETCHER_CLIENT_KEY_FILE: /run/fetcher-certs/monitoring.key
      FETCHER_ADMIN_TELEGRAM_CHAT_IDS: ${FETCHER_ADMIN_TELEGRAM_CHAT_IDS:-}
    volumes: *a1
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data: null
  prometheus_data: null
  grafana_data: null
  loki_data: null
  rabbitmq_data: null
  playwright_profile: null
  parser_profiles: null
  browserless_profiles: null
  fetcher_profiles: null
networks:
  browser_egress:
    internal: true
  fetcher_engines:
    internal: true
  fetcher_outbound: null
  redis_private:
    internal: true
