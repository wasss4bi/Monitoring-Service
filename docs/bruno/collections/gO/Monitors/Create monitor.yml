runtime:
  scripts:
    - type: before-request
      code: |-
        const raw = req.getBody({ raw: true });
        if (typeof raw !== 'string') {
          throw new Error('Open Body and uncomment exactly one marketplace JSON block.');
        }
        const active = raw.split(/\r?\n/).filter(line => !/^\s*\/\//.test(line)).join('\n').trim();
        if (!active) {
          throw new Error('Uncomment exactly one marketplace JSON block before sending.');
        }
        const sessionNames = new Set(['dnsSession', 'ozonSession', 'wildberriesSession', 'avitoSession']);
        const resolved = active.replace(/\{\{([A-Za-z_][A-Za-z0-9_]*)\}\}/g, (_match, name) => {
          if (!sessionNames.has(name)) throw new Error('Unsupported body variable: ' + name);
          const value = bru.getEnvVar(name);
          if (value === undefined || value === null || value === '') {
            throw new Error('Fill ' + name + ' in the selected environment Secrets with your own v1 export.');
          }
          let session = value;
          try { if (typeof session === 'string') session = JSON.parse(session); }
          catch { throw new Error(name + ' must contain a v1 JSON object, not a Cookie header.'); }
          if (!session || session.version !== 1 || typeof session.userAgent !== 'string' ||
              !session.userAgent || !Array.isArray(session.cookieJar?.cookies)) {
            throw new Error(name + ' must contain version=1, userAgent and cookieJar.cookies.');
          }
          return JSON.stringify(session);
        });
        let payload;
        try { payload = JSON.parse(resolved); }
        catch { throw new Error('Uncomment exactly one complete JSON object; keep other blocks commented.'); }
        if (!payload || Array.isArray(payload) || typeof payload.url !== 'string') {
          throw new Error('The selected monitor must be a JSON object with url.');
        }
        const hostname = /^https:\/\/([a-z0-9.-]+)(?:[/?#:]|$)/i.exec(payload.url)?.[1]?.toLowerCase();
        if (!hostname) throw new Error('The monitor URL must use HTTPS.');
        req.setBody(payload);
    - type: after-response
      code: |-
        if (res.status === 200 || res.status === 201) {
          const body = res.getBody();
          if (body && Number.isInteger(body.id)) bru.setEnvVar('monitorId', String(body.id));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Select environment monitoring_service. Run Authentication/Login to refresh accessToken.
  Every marketplace body is commented. Uncomment ONE complete JSON object below its // label.
  Leave the label and all other bodies commented. The pre-request script removes full-line comments locally.
  All six examples use managed guest sessions; no session export is required.
  The collection generates a fresh Idempotency-Key when the header is absent or blank.
  A manually specified header is preserved. For an exact retry, copy the previous key from Timeline.
  Cookie exports are credentials. Do not share them, logs, request screenshots or environment exports.
  WB price is in kopecks; Lemanapro uses price per square metre, not per box.
  Ozon 19 failed guest bootstrap with HTTP 403; Lemanapro 23 returned HTTP 401.
  Browser-based requests use Browserless v1; Lamoda uses HTTP/Squid json_source.
  API error.code remains the HTTP status text; error.message explains the safe business cause.
  A 409 mentioning browser_page_url means this API URL already uses another browser source.
  page_url is the product link and does not replace browser_page_url. Match the existing source settings.
  An unchanged Idempotency-Key returns the created monitor's current state, or 404 if it was deleted. Errors recorded before creation are replayed.
  See docs/api-errors.md for the error contract and safe retry guidance.
