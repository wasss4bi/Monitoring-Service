info:
  name: Get monitor
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/me/monitors/{{monitorId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  variables:
    - name: monitorId
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
