info:
  name: Get target hostname
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/target-hostnames/1"
  auth:
    type: bearer
    token: "{{adminAccessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

# Session contents are encrypted in PostgreSQL and are never returned by this API.
# JSON bootstrap restores available cookies/localStorage/IndexedDB from the previous session.
# Ordinary JSON checks reuse that session without starting Chrome; reset deliberately clears it.
