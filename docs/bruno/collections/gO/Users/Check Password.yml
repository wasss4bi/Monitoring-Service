info:
  name: Check Password
  type: http
  seq: 6
  tags:
    - Users

http:
  method: POST
  url: "{{baseUrl}}/users/{{userId}}/check-password"
  body:
    type: json
    data: |-
      {
        "password": "(Bambamtutu123)"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 201 Response
    description: User created
    request:
      url: "{{baseUrl}}/users"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "Alice",
            "email": "alice@example.com",
            "password": "secret"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 1,
            "name": "Alice",
            "email": "alice@example.com"
          }
  - name: 400 Response
    description: Invalid request
    request:
      url: "{{baseUrl}}/users"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "Alice",
            "email": "alice@example.com",
            "password": "secret"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "invalid json"
          }
  - name: 409 Response
    description: Resource conflict
    request:
      url: "{{baseUrl}}/users"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "Alice",
            "email": "alice@example.com",
            "password": "secret"
          }
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "email already exists"
          }
  - name: 500 Response
    description: Internal server error
    request:
      url: "{{baseUrl}}/users"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "Alice",
            "email": "alice@example.com",
            "password": "secret"
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "invalid json"
          }

docs: |-
  Passwords are limited to 72 UTF-8 bytes.
