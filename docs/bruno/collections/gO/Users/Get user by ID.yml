info:
  name: Get user by ID
  type: http
  seq: 3
  tags:
    - Users

http:
  method: GET
  url: "{{baseUrl}}/users/:id"
  params:
    - name: id
      value: "{{userId}}"
      type: path
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: User found
    request:
      url: "{{baseUrl}}/users/:id"
      method: GET
      params:
        - name: id
          value: "1"
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 1,
            "name": "Alice",
            "email": "alice@example.com"
          }
  - name: 400 Response
    description: Invalid request
    request:
      url: "{{baseUrl}}/users/:id"
      method: GET
      params:
        - name: id
          value: "1"
          type: path
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "invalid json"
          }
  - name: 404 Response
    description: Resource not found
    request:
      url: "{{baseUrl}}/users/:id"
      method: GET
      params:
        - name: id
          value: "1"
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "invalid json"
          }
  - name: 500 Response
    description: Internal server error
    request:
      url: "{{baseUrl}}/users/:id"
      method: GET
      params:
        - name: id
          value: "1"
          type: path
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "invalid json"
          }
