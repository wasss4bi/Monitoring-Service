info:
  name: Update user
  type: http
  seq: 4
  tags:
    - Users

http:
  method: PUT
  url: "{{baseUrl}}/users/:id"
  params:
    - name: id
      value: "{{userId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "name": "AliceUpdated",
        "email": "alice.updated@example.com",
        "password": "(Bambamtutu123)"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: User updated
    request:
      url: "{{baseUrl}}/users/:id"
      method: PUT
      params:
        - name: id
          value: "1"
          type: path
      body:
        type: json
        data: |-
          {
            "name": "Alice Updated",
            "email": "alice.updated@example.com",
            "password": "new-secret"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 1,
            "name": "Alice",
            "email": "alice@example.com"
          }
  - name: 400 Response
