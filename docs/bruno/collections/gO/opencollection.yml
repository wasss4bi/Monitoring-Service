request:
  scripts:
    - type: before-request
      code: |-
        if (['POST', 'PUT', 'PATCH', 'DELETE'].includes(req.getMethod().toUpperCase())) {
          const key = req.getHeader('Idempotency-Key');
          if (key === undefined || key === null || String(key).trim() === '') {
            req.setHeader('Idempotency-Key', bru.interpolate('{{$guid}}'));
          }
        }

